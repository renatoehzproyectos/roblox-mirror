<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox Mirror — Fase 2 · Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0c0e12;
    --panel:#14171d;
    --panel-border:#262b34;
    --text:#e7ebf0;
    --muted:#8b93a1;
    --accent:#4fd1c5;
    --warn:#e0a832;
    --err:#e05f5f;
  }
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---- Top toolbar ---- */
  #toolbar{
    height:44px;flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:0 10px;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--panel);border-bottom:1px solid var(--panel-border);
    z-index:30;
  }
  #toolbar .brand{font-size:13px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:6px;}
  #toolbar .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  #toolbar .brand b{color:var(--text);font-weight:600;}
  #toolbar button{
    background:transparent;border:1px solid var(--panel-border);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;
  }
  #toolbar button.primary{background:var(--accent);color:#04201d;border-color:var(--accent);font-weight:600;}
  #toolbar button.stop{background:var(--err);color:#fff;border-color:var(--err);font-weight:600;}
  #toolbar button:disabled{opacity:0.4;cursor:default;}
  #toolbar .toggle{display:flex;gap:4px;background:#0c0e12;border:1px solid var(--panel-border);border-radius:6px;padding:2px;}
  #toolbar .toggle button{border:none;border-radius:4px;padding:5px 10px;}
  #toolbar .toggle button.active{background:var(--panel-border);}

  /* ---- Main layout: explorer | viewport | properties, with output docked bottom ---- */
  #main{flex:1 1 auto;display:flex;min-height:0;}
  #left, #right{
    flex:0 0 auto;width:0;overflow:hidden;
    background:var(--panel);border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;transition:width .15s ease;
  }
  #right{border-right:none;border-left:1px solid var(--panel-border);}
  body.studio-on #left{width:230px;}
  body.studio-on #right{width:250px;}
  @media (max-width:820px){
    body.studio-on #left{width:170px;}
    body.studio-on #right{width:190px;}
  }

  .panel-title{
    font-size:11px;letter-spacing:.03em;color:var(--muted);
    padding:9px 12px;border-bottom:1px solid var(--panel-border);
    flex:0 0 auto;
  }
  #explorer-tree{flex:1 1 auto;overflow:auto;padding:6px 0;font-size:12.5px;}
  .node{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;white-space:nowrap;border-radius:4px;margin:0 4px;}
  .node:hover{background:#1c2026;}
  .node.selected{background:#20363580;outline:1px solid var(--accent);}
  .node .cls{color:var(--muted);font-size:10.5px;margin-left:4px;}
  .node .ic{width:14px;text-align:center;font-size:11px;opacity:.85;}

  #props-list{flex:1 1 auto;overflow:auto;padding:8px 10px;font-size:12px;}
  .prop-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #1d2128;}
  .prop-row .k{color:var(--muted);}
  .prop-row .v{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;text-align:right;word-break:break-all;}
  .prop-row input{
    background:#0c0e12;border:1px solid var(--panel-border);color:var(--text);
    border-radius:4px;padding:2px 6px;font-size:11.5px;width:110px;text-align:right;
    font-family:ui-monospace,Menlo,monospace;
  }
  #props-empty{padding:16px 12px;color:var(--muted);font-size:12px;}

  #center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;}
  #viewport-wrap{flex:1 1 auto;position:relative;min-height:0;}
  #scene{position:absolute;inset:0;}
  canvas{display:block;touch-action:none;}

  #script-editor-wrap{
    display:none;position:absolute;inset:0;background:#0d0f13;z-index:5;
    flex-direction:column;
  }
  #script-editor-wrap.open{display:flex;}
  #script-editor-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:8px 12px;border-bottom:1px solid var(--panel-border);font-size:12px;color:var(--muted);
  }
  #script-editor-head b{color:var(--text);}
  #script-editor-head .close{margin-left:auto;cursor:pointer;color:var(--muted);border:1px solid var(--panel-border);border-radius:5px;padding:3px 9px;}
  #script-editor{
    flex:1 1 auto;width:100%;resize:none;border:none;outline:none;
    background:#0d0f13;color:#d8e0ea;font-family:ui-monospace,Menlo,monospace;
    font-size:13px;line-height:1.6;padding:14px;box-sizing:border-box;
  }

  #output{
    flex:0 0 130px;background:#0d0f13;border-top:1px solid var(--panel-border);
    display:none;flex-direction:column;
  }
  body.studio-on #output{display:flex;}
  #output-head{
    flex:0 0 auto;font-size:11px;color:var(--muted);padding:6px 12px;
    border-bottom:1px solid var(--panel-border);display:flex;justify-content:space-between;
  }
  #output-head span.clear{cursor:pointer;}
  #output-body{flex:1 1 auto;overflow:auto;padding:6px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;}
  #output-body .line{padding:2px 0;color:#b7c0cc;}
  #output-body .line.warn{color:var(--warn);}
  #output-body .line.err{color:var(--err);}
  #output-body .line .src{color:#586071;margin-right:6px;}

  /* HUD over viewport */
  #hint{
    position:absolute;top:10px;right:10px;z-index:10;
    background:rgba(20,23,29,0.82);border:1px solid var(--panel-border);border-radius:8px;
    padding:8px 12px;font-size:12px;color:var(--muted);max-width:180px;text-align:right;
  }
  @media (pointer: coarse){ #hint{display:none;} }

  #touch{display:none;pointer-events:none;}
  @media (pointer: coarse){ #touch{display:block;} }
  #stick-zone{
    position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);pointer-events:auto;z-index:20;
  }
  #stick-knob{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:rgba(79,209,197,0.85);box-shadow:0 0 12px rgba(79,209,197,0.5);}
  #jump-btn{
    position:absolute;right:24px;bottom:28px;width:70px;height:70px;border-radius:50%;
    background:rgba(224,168,50,0.18);border:1px solid rgba(224,168,50,0.55);color:var(--warn);
    font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;
  }

  #edit-hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    background:rgba(20,23,29,0.85);border:1px solid var(--panel-border);border-radius:20px;
    padding:6px 14px;font-size:11.5px;color:var(--muted);
  }
  button.icon-btn{
    background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;
  }
</style>
</head>
<body class="studio-on">

<div id="app">
  <div id="toolbar">
    <div class="brand"><span class="dot"></span> Mirror Studio <b>&middot; Fase 2</b></div>
    <div class="toggle">
      <button id="btn-edit" class="active">EDIT</button>
      <button id="btn-play">PLAY</button>
    </div>
    <button id="btn-toggle-studio">Studio: ON</button>
    <button id="btn-run" class="primary">▶ Ejecutar Script</button>
    <button id="btn-stop" class="stop" disabled>■ Detener</button>
  </div>

  <div id="main">
    <div id="left">
      <div class="panel-title">EXPLORER</div>
      <div id="explorer-tree"></div>
    </div>

    <div id="center">
      <div id="viewport-wrap">
        <div id="scene"></div>
        <div id="hint">WASD para moverte<br>Espacio para saltar<br>Arrastra para mirar</div>
        <div id="edit-hint">Modo EDIT — pulsa PLAY para ejecutar la experiencia</div>

        <div id="script-editor-wrap">
          <div id="script-editor-head">
            <span>Editando:</span> <b id="script-editor-title">Script</b>
            <span class="close" id="script-editor-close">Cerrar</span>
          </div>
          <textarea id="script-editor" spellcheck="false"></textarea>
        </div>

        <div id="touch">
          <div id="stick-zone"><div id="stick-knob"></div></div>
          <div id="jump-btn">SALTAR</div>
        </div>
      </div>

      <div id="output">
        <div id="output-head"><span>OUTPUT</span><span class="clear" id="output-clear">limpiar</span></div>
        <div id="output-body"></div>
      </div>
    </div>

    <div id="right">
      <div class="panel-title">PROPERTIES</div>
      <div id="props-list"><div id="props-empty">Selecciona un objeto en el Explorer</div></div>
    </div>
  </div>
</div>

<script>
(function(){
/* ============================================================================
   MIRROR DATAMODEL
   Instance / Service system — independent implementation, not Roblox source.
   ============================================================================ */

let nextId = 1;

class MirrorInstance {
  constructor(className, name){
    this.id = nextId++;
    this.className = className;
    this.name = name || className;
    this.parent = null;
    this.children = [];
    this.properties = { Name: this.name, ClassName: className };
    this.attributes = {};
    this._events = {}; // simple event bus: eventName -> [listeners]
    this.archivable = true;
  }
  setParent(newParent){
    if (this.parent){
      const i = this.parent.children.indexOf(this);
      if (i >= 0) this.parent.children.splice(i,1);
    }
    this.parent = newParent;
    if (newParent) newParent.children.push(this);
    return this;
  }
  getChildren(){ return this.children.slice(); }
  findFirstChild(name){ return this.children.find(c => c.name === name) || null; }
  getFullName(){
    let parts = [this.name];
    let p = this.parent;
    while (p){ parts.unshift(p.name); p = p.parent; }
    return parts.join('.');
  }
  connect(eventName, fn){
    (this._events[eventName] = this._events[eventName] || []).push(fn);
    return { disconnect: () => {
      const arr = this._events[eventName];
      const i = arr.indexOf(fn); if (i>=0) arr.splice(i,1);
    }};
  }
  fire(eventName, ...args){
    (this._events[eventName] || []).forEach(fn => { try { fn(...args); } catch(e){ Output.error(this.getFullName(), e.message); } });
  }
  setProp(key, value){
    this.properties[key] = value;
    if (key === 'Name') this.name = value;
    this.fire('_propertyChanged', key, value);
  }
}

// ---- Specialized classes ----
class ServiceInstance extends MirrorInstance {
  constructor(className){ super(className, className); this.isService = true; }
}
class PartInstance extends MirrorInstance {
  constructor(name){
    super('Part', name || 'Part');
    Object.assign(this.properties, {
      Size: '4, 1, 2', Position: '0, 0, 0', Anchored: true,
      CanCollide: true, Material: 'Plastic', BrickColor: 'Medium stone grey', Transparency: 0
    });
  }
}
class ScriptInstance extends MirrorInstance {
  constructor(name, kind, source){
    super(kind, name || kind);
    this.runContext = kind === 'LocalScript' ? 'Client' : (kind === 'ModuleScript' ? 'Shared' : 'Server');
    this.properties.RunContext = this.runContext;
    this.source = source || `-- ${kind}: ${name}\nprint("Hola desde ${name}")\n`;
    this.properties.Enabled = true;
  }
}
class FolderInstance extends MirrorInstance {
  constructor(name){ super('Folder', name || 'Folder'); }
}
class RemoteEventInstance extends MirrorInstance {
  constructor(name){ super('RemoteEvent', name || 'RemoteEvent'); }
  fireServer(...args){ this.fire('OnServerEvent', 'player', ...args); Output.log(this.getFullName(), 'FireServer(' + args.join(', ') + ')'); }
  fireClient(...args){ this.fire('OnClientEvent', ...args); Output.log(this.getFullName(), 'FireClient(' + args.join(', ') + ')'); }
}

/* ---- Build the DataModel tree ("game") ---- */
const game = new ServiceInstance('DataModel');
game.name = 'game';

const Workspace   = new ServiceInstance('Workspace');   Workspace.setParent(game);
const Players     = new ServiceInstance('Players');     Players.setParent(game);
const Lighting    = new ServiceInstance('Lighting');    Lighting.setParent(game);
const ReplicatedStorage = new ServiceInstance('ReplicatedStorage'); ReplicatedStorage.setParent(game);
const ServerScriptService = new ServiceInstance('ServerScriptService'); ServerScriptService.setParent(game);
const ServerStorage = new ServiceInstance('ServerStorage'); ServerStorage.setParent(game);
const StarterGui  = new ServiceInstance('StarterGui');  StarterGui.setParent(game);
const StarterPack = new ServiceInstance('StarterPack'); StarterPack.setParent(game);
const StarterPlayer = new ServiceInstance('StarterPlayer'); StarterPlayer.setParent(game);
const SoundService = new ServiceInstance('SoundService'); SoundService.setParent(game);

const Baseplate = new PartInstance('Baseplate');
Baseplate.properties.Size = '512, 1, 512';
Baseplate.properties.Anchored = true;
Baseplate.setParent(Workspace);

const SpawnLocation = new MirrorInstance('SpawnLocation', 'SpawnLocation');
SpawnLocation.properties.Size = '6, 1, 6';
SpawnLocation.setParent(Workspace);

// example content the "creator" already has, to demonstrate scripts running for real
const greeterScript = new ScriptInstance('Greeter', 'Script',
`-- Server Script (ejecutado por Mirror Runtime)
print("Servidor iniciado")
game.Players.PlayerAdded:Connect(function(player)
  print(player, "se unio al juego")
end)
`);
greeterScript.setParent(ServerScriptService);

const clientScript = new ScriptInstance('CameraTip', 'LocalScript',
`-- Local Script (cliente)
print("Cliente listo")
wait(1)
print("Consejo: arrastra para mirar alrededor")
`);
clientScript.setParent(StarterPlayer);

const utilModule = new MirrorInstance('MathUtils', 'ModuleScript');
utilModule.className = 'ModuleScript';
utilModule.properties.ClassName = 'ModuleScript';
utilModule.source = `-- ModuleScript\nreturn { add = function(a,b) return a+b end }\n`;
utilModule.setParent(ReplicatedStorage);

const purchaseRemote = new RemoteEventInstance('PurchaseItem');
purchaseRemote.setParent(ReplicatedStorage);

/* ============================================================================
   OUTPUT PANEL
   ============================================================================ */
const Output = {
  el: null,
  init(){ this.el = document.getElementById('output-body'); },
  _push(cls, src, msg){
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' '+cls : '');
    div.innerHTML = '<span class="src">' + (src||'') + '</span>' + escapeHtml(msg);
    this.el.appendChild(div);
    this.el.scrollTop = this.el.scrollHeight;
  },
  log(src, msg){ this._push('', src, msg); },
  warn(src, msg){ this._push('warn', src, msg); },
  error(src, msg){ this._push('err', src, msg); },
  clear(){ this.el.innerHTML = ''; }
};
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============================================================================
   MIRROR SCRIPT RUNTIME
   Honest note: this is NOT a Luau VM yet. It's a small, sandboxed JS-hosted
   surface that mimics the Luau API creators use most (print, wait, Connect,
   game/services). A real Luau bytecode interpreter is planned for Fase 6+.
   Scripts here are written against that JS-hosted subset, not real Luau syntax.
   ============================================================================ */
const RunningConnections = [];

function makeSandboxAPI(scriptInst){
  const src = scriptInst.getFullName();
  function print(...args){ Output.log(src, args.map(String).join(' ')); }
  function warn(...args){ Output.warn(src, args.map(String).join(' ')); }
  function wait(seconds){ return new Promise(res => setTimeout(res, (seconds||0.03)*1000)); }
  function task_wait(seconds){ return wait(seconds); }
  return { print, warn, wait, task: { wait: task_wait }, game, workspace: Workspace };
}

async function runScript(scriptInst){
  if (!scriptInst.source) return;
  const api = makeSandboxAPI(scriptInst);
  const fnBody = `
    "use strict";
    const { print, warn, wait, task, game, workspace } = api;
    return (async () => { ${scriptInst.source} })();
  `;
  try {
    const fn = new Function('api', fnBody);
    await fn(api);
  } catch (e) {
    Output.error(scriptInst.getFullName(), e.message);
  }
}

function stopAllScripts(){
  RunningConnections.forEach(c => { try { c.disconnect && c.disconnect(); } catch(e){} });
  RunningConnections.length = 0;
}

/* ============================================================================
   EXPLORER UI
   ============================================================================ */
const treeEl = document.getElementById('explorer-tree');
const propsEl = document.getElementById('props-list');
let selected = null;

const ICONS = {
  DataModel:'🎮', Workspace:'🗺️', Players:'👥', Lighting:'💡',
  ReplicatedStorage:'🔁', ServerScriptService:'🖥️', ServerStorage:'📦',
  StarterGui:'🪟', StarterPack:'🎒', StarterPlayer:'🧍', SoundService:'🔊',
  Part:'🧱', SpawnLocation:'🔴', Script:'📜', LocalScript:'📄', ModuleScript:'📘',
  Folder:'📁', RemoteEvent:'📡'
};

function renderTree(){
  treeEl.innerHTML = '';
  const rootUl = buildNode(game, 0);
  treeEl.appendChild(rootUl);
}
function buildNode(inst, depth){
  const row = document.createElement('div');
  row.className = 'node' + (selected === inst ? ' selected' : '');
  row.style.paddingLeft = (10 + depth*14) + 'px';
  const icon = ICONS[inst.className] || '⬜';
  row.innerHTML = `<span class="ic">${icon}</span><span>${inst.name}</span><span class="cls">${inst.className}</span>`;
  row.addEventListener('click', (e) => { e.stopPropagation(); select(inst); });
  const wrap = document.createElement('div');
  wrap.appendChild(row);
  inst.children.forEach(child => wrap.appendChild(buildNode(child, depth+1)));
  return wrap;
}

function select(inst){
  selected = inst;
  renderTree();
  renderProps();
}

function renderProps(){
  if (!selected){ propsEl.innerHTML = '<div id="props-empty">Selecciona un objeto en el Explorer</div>'; return; }
  propsEl.innerHTML = '';
  const isScript = ['Script','LocalScript','ModuleScript'].includes(selected.className);
  Object.entries(selected.properties).forEach(([k,v]) => {
    const row = document.createElement('div');
    row.className = 'prop-row';
    const editable = typeof v !== 'object';
    row.innerHTML = `<span class="k">${k}</span>` + (editable
      ? `<input data-key="${k}" value="${String(v)}">`
      : `<span class="v">${String(v)}</span>`);
    propsEl.appendChild(row);
  });
  if (editable_listeners_needed()) {}
  propsEl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      let val = inp.value;
      if (val === 'true') val = true; else if (val === 'false') val = false;
      selected.setProp(inp.dataset.key, val);
      renderTree();
    });
  });
  if (isScript){
    const btn = document.createElement('button');
    btn.textContent = '✎ Abrir Script Editor';
    btn.style.cssText = 'margin-top:8px;width:100%;padding:8px;border-radius:6px;border:1px solid var(--panel-border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;';
    btn.addEventListener('click', () => openScriptEditor(selected));
    propsEl.appendChild(btn);
  }
}
function editable_listeners_needed(){ return false; }

/* ============================================================================
   SCRIPT EDITOR
   ============================================================================ */
const editorWrap = document.getElementById('script-editor-wrap');
const editorTitle = document.getElementById('script-editor-title');
const editorTextarea = document.getElementById('script-editor');
let editingScript = null;

function openScriptEditor(scriptInst){
  editingScript = scriptInst;
  editorTitle.textContent = scriptInst.getFullName() + ' (' + scriptInst.className + ')';
  editorTextarea.value = scriptInst.source || '';
  editorWrap.classList.add('open');
}
document.getElementById('script-editor-close').addEventListener('click', () => {
  if (editingScript) editingScript.source = editorTextarea.value;
  editorWrap.classList.remove('open');
});

document.getElementById('btn-run').addEventListener('click', async () => {
  if (editingScript) editingScript.source = editorTextarea.value;
  const target = editingScript || selected;
  if (!target || !['Script','LocalScript','ModuleScript'].includes(target.className)){
    Output.warn('Mirror', 'Selecciona un Script para ejecutar.');
    return;
  }
  Output.log('Mirror', 'Ejecutando ' + target.getFullName() + ' …');
  await runScript(target);
});
document.getElementById('btn-stop').addEventListener('click', () => {
  stopAllScripts();
  Output.log('Mirror', 'Detenido.');
});

/* ============================================================================
   STUDIO TOGGLE + EDIT/PLAY MODE
   ============================================================================ */
document.getElementById('btn-toggle-studio').addEventListener('click', (e) => {
  document.body.classList.toggle('studio-on');
  e.target.textContent = document.body.classList.contains('studio-on') ? 'Studio: ON' : 'Studio: OFF';
});

const btnEdit = document.getElementById('btn-edit');
const btnPlay = document.getElementById('btn-play');
const btnStop = document.getElementById('btn-stop');
const editHint = document.getElementById('edit-hint');
let playMode = false;

async function enterPlayMode(){
  playMode = true;
  btnEdit.classList.remove('active'); btnPlay.classList.add('active');
  btnStop.disabled = false;
  editHint.style.display = 'none';
  Output.clear();
  Output.log('Mirror Runtime', 'Iniciando experiencia…');
  // Run every Script / LocalScript in the tree, server-authoritative pieces first
  const all = [];
  (function collect(inst){ all.push(inst); inst.children.forEach(collect); })(game);
  const serverScripts = all.filter(i => i.className === 'Script');
  const localScripts = all.filter(i => i.className === 'LocalScript');
  for (const s of serverScripts) await runScript(s);
  Players.fire('PlayerAdded', 'Player1');
  for (const s of localScripts) await runScript(s);
}
function exitPlayMode(){
  playMode = false;
  btnEdit.classList.add('active'); btnPlay.classList.remove('active');
  btnStop.disabled = true;
  editHint.style.display = '';
  stopAllScripts();
}
btnEdit.addEventListener('click', exitPlayMode);
btnPlay.addEventListener('click', enterPlayMode);
document.getElementById('output-clear').addEventListener('click', () => Output.clear());

/* ============================================================================
   3D RUNTIME (Fase 1, reused) — Baseplate + Noob + camera + input
   ============================================================================ */
Output.init();
renderTree();

const sceneRoot = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
function sizeRenderer(){
  const w = sceneRoot.clientWidth, h = sceneRoot.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
sceneRoot.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7f2);
scene.fog = new THREE.Fog(0x8fc7f2, 60, 220);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);

const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x4a5a3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.15);
sun.position.set(60, 90, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; sun.shadow.camera.far=300;
scene.add(sun);

const PLATE_SIZE = 128;
const plate = new THREE.Mesh(new THREE.BoxGeometry(PLATE_SIZE,1,PLATE_SIZE), new THREE.MeshStandardMaterial({color:0x3d7a3d, roughness:0.95}));
plate.position.y = -0.5; plate.receiveShadow = true; scene.add(plate);
const grid = new THREE.GridHelper(PLATE_SIZE, PLATE_SIZE/4, 0x2a5c2a, 0x2a5c2a);
grid.position.y = 0.01; grid.material.opacity = 0.25; grid.material.transparent = true; scene.add(grid);

function block(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, roughness:0.6, metalness:0.05}));
  m.castShadow = true; m.receiveShadow = true; return m;
}
const character = new THREE.Group();
const torso = block(2,2,1,0x2b5fad); torso.position.y=3; character.add(torso);
const head = block(1.4,1.4,1.4,0xf3c93c); head.position.y=4.7; character.add(head);
const eyeMat = new THREE.MeshStandardMaterial({color:0x1a1a1a});
const eyeGeo = new THREE.BoxGeometry(0.14,0.14,0.05);
const eyeL = new THREE.Mesh(eyeGeo,eyeMat); eyeL.position.set(-0.3,4.75,0.73);
const eyeR = new THREE.Mesh(eyeGeo,eyeMat); eyeR.position.set(0.3,4.75,0.73);
character.add(eyeL,eyeR);
const smile = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.05), eyeMat); smile.position.set(0,4.45,0.73); character.add(smile);
const armL = block(0.6,2,0.6,0xf3c93c); armL.position.set(-1.3,3,0); character.add(armL);
const armR = block(0.6,2,0.6,0xf3c93c); armR.position.set(1.3,3,0); character.add(armR);
const legL = block(0.8,2,0.8,0x4a8f3c); legL.position.set(-0.5,1,0); character.add(legL);
const legR = block(0.8,2,0.8,0x4a8f3c); legR.position.set(0.5,1,0); character.add(legR);
scene.add(character);

const spawnMesh = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,0.15,24), new THREE.MeshStandardMaterial({color:0xd94f4f, transparent:true, opacity:0.55, emissive:0x330000}));
spawnMesh.position.set(0,0.08,0); scene.add(spawnMesh);

[[10,-6],[-14,8],[6,14]].forEach(([x,z]) => { const b = block(3,3,3,0x9a9a9a); b.position.set(x,1.5,z); scene.add(b); });

const state = {
  velocityY:0, onGround:true, yaw:0, camYaw:Math.PI, camPitch:0.35, camDistance:9,
  move:{x:0,z:0}, jumpRequested:false, speed:9, jumpVelocity:9.5, gravity:24
};
const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true; if (e.code==='Space') state.jumpRequested = true; });
window.addEventListener('keyup', e => { keys[e.code]=false; });
function readKeyboardMove(){
  let x=0,z=0;
  if (keys['KeyW']||keys['ArrowUp']) z-=1;
  if (keys['KeyS']||keys['ArrowDown']) z+=1;
  if (keys['KeyA']||keys['ArrowLeft']) x-=1;
  if (keys['KeyD']||keys['ArrowRight']) x+=1;
  const len = Math.hypot(x,z); if (len>0){x/=len; z/=len;}
  return {x,z};
}
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.target.closest('#stick-zone') || e.target.closest('#jump-btn')) return;
  dragging=true; lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('pointerup', ()=>{dragging=false;});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  state.camYaw -= dx*0.006;
  state.camPitch = Math.max(0.08, Math.min(1.1, state.camPitch - dy*0.004));
});
const stickZone=document.getElementById('stick-zone'), stickKnob=document.getElementById('stick-knob'), jumpBtn=document.getElementById('jump-btn');
let stickActive=false, stickId=null; const stickCenter={x:0,y:0};
stickZone.addEventListener('pointerdown', e => {
  stickActive=true; stickId=e.pointerId;
  const r=stickZone.getBoundingClientRect(); stickCenter.x=r.left+r.width/2; stickCenter.y=r.top+r.height/2;
  stickZone.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', e => {
  if (!stickActive || e.pointerId!==stickId) return;
  let dx=e.clientX-stickCenter.x, dy=e.clientY-stickCenter.y; const max=42;
  const len=Math.hypot(dx,dy); if (len>max){dx=dx/len*max; dy=dy/len*max;}
  stickKnob.style.left=(36+dx)+'px'; stickKnob.style.top=(36+dy)+'px';
  state.move.x=dx/max; state.move.z=dy/max;
});
window.addEventListener('pointerup', e => {
  if (e.pointerId!==stickId) return;
  stickActive=false; stickKnob.style.left='36px'; stickKnob.style.top='36px'; state.move.x=0; state.move.z=0;
});
jumpBtn.addEventListener('pointerdown', ()=>{state.jumpRequested=true;});

window.addEventListener('resize', sizeRenderer);

const clock = new THREE.Clock();
function update(dt){
  const kb = readKeyboardMove();
  const kbActive = keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']||keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight'];
  const mx = kbActive ? kb.x : state.move.x;
  const mz = kbActive ? kb.z : state.move.z;
  const forward = new THREE.Vector3(Math.sin(state.camYaw), 0, Math.cos(state.camYaw));
  const right = new THREE.Vector3(Math.sin(state.camYaw+Math.PI/2), 0, Math.cos(state.camYaw+Math.PI/2));
  const moveDir = new THREE.Vector3();
  moveDir.addScaledVector(forward, mz); moveDir.addScaledVector(right, mx);
  if (moveDir.lengthSq() > 0.0001){
    moveDir.normalize();
    character.position.addScaledVector(moveDir, state.speed*dt);
    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    let diff = targetYaw - state.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    state.yaw += diff*Math.min(1, dt*10);
    character.rotation.y = state.yaw;
  }
  const half = PLATE_SIZE/2 - 2;
  character.position.x = Math.max(-half, Math.min(half, character.position.x));
  character.position.z = Math.max(-half, Math.min(half, character.position.z));
  if (state.jumpRequested && state.onGround){ state.velocityY = state.jumpVelocity; state.onGround=false; }
  state.jumpRequested = false;
  state.velocityY -= state.gravity*dt;
  character.position.y += state.velocityY*dt;
  if (character.position.y <= 0){ character.position.y=0; state.velocityY=0; state.onGround=true; }
  const camTarget = character.position.clone().add(new THREE.Vector3(0,3.2,0));
  const camOffset = new THREE.Vector3(
    Math.sin(state.camYaw) * -state.camDistance * Math.cos(state.camPitch),
    state.camDistance*Math.sin(state.camPitch)+1.5,
    Math.cos(state.camYaw) * -state.camDistance * Math.cos(state.camPitch)
  );
  camera.position.lerp(camTarget.clone().add(camOffset), Math.min(1, dt*8));
  camera.lookAt(camTarget);
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
}
sizeRenderer();
animate();

// select Workspace by default so Properties isn't empty
select(Workspace);
})();
</script>
</body>
</html>
