<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox Mirror — Fase 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0c0e12;
    --panel:#14171d;
    --panel-border:#262b34;
    --text:#e7ebf0;
    --muted:#8b93a1;
    --accent:#4fd1c5;
    --warn:#e0a832;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #scene{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}

  #hud{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:14px;
    z-index:10;
    pointer-events:none;
  }
  #hud .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(20,23,29,0.82);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    color:var(--muted);
    backdrop-filter: blur(6px);
  }
  #hud .badge b{color:var(--text);font-weight:600;}
  #hud .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

  #panel{
    position:fixed;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    left:14px;
    right:14px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    pointer-events:none;
  }
  #status{
    background:rgba(20,23,29,0.82);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:10px 14px;
    font-size:12px;
    line-height:1.7;
    color:var(--muted);
    backdrop-filter: blur(6px);
    max-width:280px;
  }
  #status .row{display:flex;justify-content:space-between;gap:16px;}
  #status .ok{color:var(--accent);}
  #status .k{color:var(--text);}

  /* touch controls */
  #touch{
    display:none;
    pointer-events:none;
  }
  @media (pointer: coarse){
    #touch{display:block;}
  }
  #stick-zone{
    position:fixed;
    left:calc(20px + env(safe-area-inset-left,0px));
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    width:130px;height:130px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    pointer-events:auto;
    z-index:20;
  }
  #stick-knob{
    position:absolute;
    width:52px;height:52px;
    left:39px;top:39px;
    border-radius:50%;
    background:rgba(79,209,197,0.85);
    box-shadow:0 0 12px rgba(79,209,197,0.5);
  }
  #jump-btn{
    position:fixed;
    right:calc(24px + env(safe-area-inset-right,0px));
    bottom:calc(30px + env(safe-area-inset-bottom,0px));
    width:76px;height:76px;
    border-radius:50%;
    background:rgba(224,168,50,0.18);
    border:1px solid rgba(224,168,50,0.55);
    color:var(--warn);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    display:flex;align-items:center;justify-content:center;
    pointer-events:auto;
    z-index:20;
    user-select:none;
  }

  #hint{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    right:14px;
    z-index:10;
    background:rgba(20,23,29,0.82);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:12px;
    color:var(--muted);
    max-width:180px;
    text-align:right;
    backdrop-filter: blur(6px);
  }
  @media (pointer: coarse){ #hint{display:none;} }
</style>
</head>
<body>

<div id="scene"></div>

<div id="hud">
  <div class="badge"><span class="dot"></span> Mirror Runtime <b>&middot; Fase 1</b></div>
</div>

<div id="hint">WASD para moverte<br>Espacio para saltar<br>Arrastra para mirar</div>

<div id="panel">
  <div id="status">
    <div class="row"><span>Renderer</span><span class="ok" id="renderer-name">—</span></div>
    <div class="row"><span>Baseplate</span><span class="k">512 × 1 × 512</span></div>
    <div class="row"><span>Character</span><span class="k">Classic Noob</span></div>
    <div class="row"><span>Camera</span><span class="k">Third-person</span></div>
  </div>
</div>

<div id="touch">
  <div id="stick-zone"><div id="stick-knob"></div></div>
  <div id="jump-btn">SALTAR</div>
</div>

<script>
(function(){
  const sceneRoot = document.getElementById('scene');

  // ---------- Renderer setup: WebGPU-preferred concept, WebGL2 fallback in practice ----------
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sceneRoot.appendChild(renderer.domElement);

  const rendererLabel = document.getElementById('renderer-name');
  rendererLabel.textContent = 'WebGL2';

  // ---------- Scene ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc7f2);
  scene.fog = new THREE.Fog(0x8fc7f2, 60, 220);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);

  // Lighting (Roblox-like: sun + soft ambient)
  const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x4a5a3a, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.15);
  sun.position.set(60, 90, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -80;
  sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80;
  sun.shadow.camera.bottom = -80;
  sun.shadow.camera.far = 300;
  scene.add(sun);

  // ---------- Baseplate (512 x 1 x 512, Roblox studs mapped to scene units at reduced scale) ----------
  const PLATE_SIZE = 128; // scaled down for a comfortable viewport, ratio matches 512x1x512
  const plateGeo = new THREE.BoxGeometry(PLATE_SIZE, 1, PLATE_SIZE);
  const plateMat = new THREE.MeshStandardMaterial({ color: 0x3d7a3d, roughness: 0.95, metalness: 0.0 });
  const baseplate = new THREE.Mesh(plateGeo, plateMat);
  baseplate.position.y = -0.5;
  baseplate.receiveShadow = true;
  scene.add(baseplate);

  // simple grid overlay to read as "studs"
  const grid = new THREE.GridHelper(PLATE_SIZE, PLATE_SIZE/4, 0x2a5c2a, 0x2a5c2a);
  grid.position.y = 0.01;
  grid.material.opacity = 0.25;
  grid.material.transparent = true;
  scene.add(grid);

  // ---------- Classic Noob character ----------
  const NOOB_YELLOW = 0xf3c93c;
  const NOOB_BLUE = 0x2b5fad;
  const NOOB_GREEN = 0x4a8f3c;

  function block(w,h,d,color){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mat = new THREE.MeshStandardMaterial({ color, roughness:0.6, metalness:0.05 });
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  const character = new THREE.Group();

  const torso = block(2, 2, 1, NOOB_BLUE);
  torso.position.y = 3;
  character.add(torso);

  const head = block(1.4, 1.4, 1.4, NOOB_YELLOW);
  head.position.y = 4.7;
  character.add(head);

  // face decal via small dark boxes (kept simple/abstract, no reproduced artwork)
  const eyeGeo = new THREE.BoxGeometry(0.14,0.14,0.05);
  const eyeMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.3, 4.75, 0.73);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.3, 4.75, 0.73);
  character.add(eyeL, eyeR);
  const smile = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.05), eyeMat);
  smile.position.set(0, 4.45, 0.73);
  character.add(smile);

  const armL = block(0.6, 2, 0.6, NOOB_YELLOW); armL.position.set(-1.3, 3, 0);
  const armR = block(0.6, 2, 0.6, NOOB_YELLOW); armR.position.set(1.3, 3, 0);
  character.add(armL, armR);

  const legL = block(0.8, 2, 0.8, NOOB_GREEN); legL.position.set(-0.5, 1, 0);
  const legR = block(0.8, 2, 0.8, NOOB_GREEN); legR.position.set(0.5, 1, 0);
  character.add(legL, legR);

  character.position.set(0, 0, 0);
  scene.add(character);

  // ---------- SpawnLocation marker ----------
  const spawnGeo = new THREE.CylinderGeometry(2.2, 2.2, 0.15, 24);
  const spawnMat = new THREE.MeshStandardMaterial({ color:0xd94f4f, transparent:true, opacity:0.55, emissive:0x330000 });
  const spawn = new THREE.Mesh(spawnGeo, spawnMat);
  spawn.position.set(0, 0.08, 0);
  scene.add(spawn);

  // a couple of reference parts so the world doesn't feel empty
  [[10,-6],[ -14,8],[6,14]].forEach(([x,z])=>{
    const b = block(3,3,3, 0x9a9a9a);
    b.position.set(x, 1.5, z);
    scene.add(b);
  });

  // ---------- Character controller state ----------
  const state = {
    velocityY: 0,
    onGround: true,
    yaw: 0,          // character facing
    camYaw: Math.PI, // camera orbit yaw
    camPitch: 0.35,
    camDistance: 9,
    move: { x:0, z:0 }, // -1..1
    jumpRequested: false,
    speed: 9,
    jumpVelocity: 9.5,
    gravity: 24
  };

  const keys = {};
  window.addEventListener('keydown', (e)=>{
    keys[e.code] = true;
    if (e.code === 'Space') state.jumpRequested = true;
  });
  window.addEventListener('keyup', (e)=>{ keys[e.code] = false; });

  function readKeyboardMove(){
    let x = 0, z = 0;
    if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) z += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) x += 1;
    const len = Math.hypot(x,z);
    if (len > 0){ x/=len; z/=len; }
    return { x, z };
  }

  // ---------- Mouse look (drag) ----------
  let dragging = false, lastX=0, lastY=0;
  renderer.domElement.addEventListener('pointerdown', (e)=>{
    if (e.target.closest('#stick-zone') || e.target.closest('#jump-btn')) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('pointerup', ()=>{ dragging = false; });
  window.addEventListener('pointermove', (e)=>{
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    state.camYaw -= dx * 0.006;
    state.camPitch = Math.max(0.08, Math.min(1.1, state.camPitch - dy * 0.004));
  });

  // ---------- Touch controls ----------
  const stickZone = document.getElementById('stick-zone');
  const stickKnob = document.getElementById('stick-knob');
  const jumpBtn = document.getElementById('jump-btn');
  let stickActive = false, stickId = null;
  const stickCenter = {x:0,y:0};

  function stickStart(e){
    stickActive = true;
    stickId = e.pointerId;
    const r = stickZone.getBoundingClientRect();
    stickCenter.x = r.left + r.width/2;
    stickCenter.y = r.top + r.height/2;
    stickZone.setPointerCapture(e.pointerId);
  }
  function stickMove(e){
    if (!stickActive || e.pointerId !== stickId) return;
    let dx = e.clientX - stickCenter.x;
    let dy = e.clientY - stickCenter.y;
    const max = 45;
    const len = Math.hypot(dx,dy);
    if (len > max){ dx = dx/len*max; dy = dy/len*max; }
    stickKnob.style.left = (39 + dx) + 'px';
    stickKnob.style.top = (39 + dy) + 'px';
    state.move.x = dx / max;
    state.move.z = dy / max;
  }
  function stickEnd(e){
    if (e.pointerId !== stickId) return;
    stickActive = false;
    stickKnob.style.left = '39px';
    stickKnob.style.top = '39px';
    state.move.x = 0; state.move.z = 0;
  }
  stickZone.addEventListener('pointerdown', stickStart);
  window.addEventListener('pointermove', stickMove);
  window.addEventListener('pointerup', stickEnd);

  jumpBtn.addEventListener('pointerdown', ()=>{ state.jumpRequested = true; });

  // ---------- Resize ----------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Main loop ----------
  const clock = new THREE.Clock();

  function update(dt){
    const kb = readKeyboardMove();
    const mx = keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']||keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']
      ? kb.x : state.move.x;
    const mz = keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']||keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']
      ? kb.z : state.move.z;

    // movement relative to camera yaw
    const forward = new THREE.Vector3(Math.sin(state.camYaw), 0, Math.cos(state.camYaw));
    const right = new THREE.Vector3(Math.sin(state.camYaw + Math.PI/2), 0, Math.cos(state.camYaw + Math.PI/2));

    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, mz);
    moveDir.addScaledVector(right, mx);

    if (moveDir.lengthSq() > 0.0001){
      moveDir.normalize();
      character.position.addScaledVector(moveDir, state.speed * dt);
      const targetYaw = Math.atan2(moveDir.x, moveDir.z);
      let diff = targetYaw - state.yaw;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      state.yaw += diff * Math.min(1, dt*10);
      character.rotation.y = state.yaw;
    }

    // clamp to baseplate
    const half = PLATE_SIZE/2 - 2;
    character.position.x = Math.max(-half, Math.min(half, character.position.x));
    character.position.z = Math.max(-half, Math.min(half, character.position.z));

    // gravity / jump
    if (state.jumpRequested && state.onGround){
      state.velocityY = state.jumpVelocity;
      state.onGround = false;
    }
    state.jumpRequested = false;

    state.velocityY -= state.gravity * dt;
    character.position.y += state.velocityY * dt;
    if (character.position.y <= 0){
      character.position.y = 0;
      state.velocityY = 0;
      state.onGround = true;
    }

    // camera orbit (third-person)
    const camTarget = character.position.clone().add(new THREE.Vector3(0, 3.2, 0));
    const camOffset = new THREE.Vector3(
      Math.sin(state.camYaw) * -state.camDistance * Math.cos(state.camPitch),
      state.camDistance * Math.sin(state.camPitch) + 1.5,
      Math.cos(state.camYaw) * -state.camDistance * Math.cos(state.camPitch)
    );
    const desiredPos = camTarget.clone().add(camOffset);
    camera.position.lerp(desiredPos, Math.min(1, dt*8));
    camera.lookAt(camTarget);
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    update(dt);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
